# Defaults capability registry — Doctor consults before inventing APIs.
# Keys align with docs/AGENT_RUNTIME_VISION.md §6.5.

listings.http_scrape:
  description: Listing discovery via Brave web search scoped with site: (Cars.com, Edmunds, …)
  caps: [net:fetch]
  envKeys: [BRAVE_API_KEY]
  fallbackEnvKeys: [TAVILY_API_KEY]
  notes: |
    No headless browser in MVP. Skill embeds a site host and searches site:<host> <query>.
    OFFLINE uses mock /mock/brave. Live needs BRAVE_API_KEY (or Tavily fallback).

search.web:
  description: Web search via Brave Search (Tavily as fallback env)
  caps: [net:fetch]
  envKeys: [BRAVE_API_KEY]
  fallbackEnvKeys: [TAVILY_API_KEY]

voice.outbound_bland:
  description: Outbound phone call via Bland AI
  caps: [notify:phone, net:fetch]
  envKeys: [BLAND_API_KEY]
  notes: |
    POST https://api.bland.ai/v1/calls
    Conversational: one question per turn.

composio.apify:
  description: Apify Actors via skill-scoped Composio (Forge requests; skill owns binding)
  caps: [net:fetch]
  envKeys: [COMPOSIO_API_KEY]
  notes: |
    Talk request_capability only. Forge may request_composio_access toolkit=apify for
    this skill (userId nightborn:skill:<name>). Runtime uses host proxy
    /api/composio/skill/<name>/execute — COMPOSIO_API_KEY never enters skill child env.
    Email/SMTP toolkits are denied on the Composio gateway.
