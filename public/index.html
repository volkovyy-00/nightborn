<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nightborn · stub</title>
    <style>
      body { font-family: ui-monospace, monospace; background: #0d0f12; color: #d8dde6; margin: 1.5rem; }
      h1 { letter-spacing: 0.08em; }
      #reply { white-space: pre-wrap; min-height: 3rem; border-left: 2px solid #3d8; padding-left: 0.75rem; }
      #log { font-size: 12px; max-height: 50vh; overflow: auto; }
      .ln { opacity: 0.85; }
      button, input { font: inherit; }
      input { width: min(40rem, 100%); background: #161a20; color: inherit; border: 1px solid #333; padding: 0.4rem; }
      .chips button { margin: 0.25rem 0.25rem 0 0; }
      .muted { opacity: 0.6; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>NIGHTBORN <span class="muted">stub UI — real surface from UI worktree</span></h1>
    <p>CHARTER LOCKED · <code id="hash">—</code> · <span id="strip">charter unchanged since boot · granted ⊆ charter</span></p>
    <p class="muted">VOICE · WAV · see docs/UI_CONTRACT.md</p>
    <div id="reply">Awake. Waiting for /api/talk.</div>
    <div class="chips">
      <button data-t="News on Microsoft">News on Microsoft</button>
      <button data-t="News on OpenAI">News on OpenAI</button>
      <button data-t="Email this news digest to my boss every morning.">Email digest…</button>
    </div>
    <p>
      <input id="msg" placeholder="Message Nightborn" />
      <button id="send">Send</button>
    </p>
    <h2>SURGERY LOG</h2>
    <div id="log"></div>
    <script>
      let since = 0;
      let first = true;
      const reply = document.getElementById("reply");
      const logEl = document.getElementById("log");
      const hashEl = document.getElementById("hash");
      const sendBtn = document.getElementById("send");
      const chips = [...document.querySelectorAll(".chips button")];

      function setBusy(b) {
        sendBtn.disabled = b;
        chips.forEach((c) => (c.disabled = b));
      }

      async function poll() {
        const r = await fetch("/api/log?since=" + since);
        const data = await r.json();
        if (data.next < since) {
          since = 0;
          first = true;
          logEl.innerHTML = "";
          return poll();
        }
        for (const line of data.lines) {
          if (!hashEl.dataset.set) {
            hashEl.textContent = (line.charterHash || "").slice(0, 8);
            hashEl.dataset.set = "1";
          }
          if (!first) {
            const div = document.createElement("div");
            div.className = "ln";
            div.textContent = [line.ts, line.event, line.actor, line.detail || "", (line.charterHash || "").slice(0, 8)].join(" · ");
            logEl.appendChild(div);
          }
        }
        if (first) first = false;
        since = data.next;
      }

      async function talk(text) {
        setBusy(true);
        try {
          const r = await fetch("/api/talk", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ text }),
          });
          const data = await r.json();
          reply.textContent = data.kind === "chat" ? data.text : data.reply;
        } catch (e) {
          reply.textContent = String(e);
        } finally {
          setBusy(false);
        }
      }

      sendBtn.onclick = () => talk(document.getElementById("msg").value);
      chips.forEach((b) => (b.onclick = () => talk(b.dataset.t)));
      setInterval(poll, 1000);
      poll();
    </script>
  </body>
</html>
